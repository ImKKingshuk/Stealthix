name: "Moderate Security Policy"
version: "1.0"
description: "Balanced policy that fails on high CVSS findings, flags medium findings"
rules:
  - name: "High CVSS Fails Scan"
    type: "cvss_threshold"
    threshold: 7.0
    operator: ">="
    action: "fail_scan"
    enabled: true
  - name: "Medium CVSS Flagged"
    type: "cvss_threshold"
    threshold: 4.0
    operator: ">="
    action: "flag_finding"
    enabled: true
  - name: "Forbidden Stacked Queries"
    type: "forbidden_kinds"
    kinds: ["sqli-stacked"]
    action: "fail_scan"
    enabled: true
compliance:
  frameworks:
    - owasp_top_10
    - pci_dss_v4
  strict_mode: false
