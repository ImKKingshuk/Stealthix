name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.metadata.outputs.release_ref }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag and embedded versions
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              tag,
          )
          if match is None:
              raise SystemExit(f"Release tag must be vX.Y.Z, got {tag!r}")

          version = tag[1:]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          versions = {"pyproject.toml": pyproject["project"]["version"]}

          init_text = Path("stealthix/__init__.py").read_text(encoding="utf-8")
          init_match = re.search(r"__version__\s*=\s*[\"']([^\"']+)[\"']", init_text)
          if init_match is None:
              raise SystemExit("stealthix/__init__.py does not define __version__")
          versions["stealthix/__init__.py"] = init_match.group(1)

          for manifest_path in ("stealthix-core/Cargo.toml", "stealthix-tui/Cargo.toml"):
              manifest = tomllib.loads(Path(manifest_path).read_text(encoding="utf-8"))
              versions[manifest_path] = manifest["package"]["version"]

          mismatches = {path: actual for path, actual in versions.items() if actual != version}
          if mismatches:
              details = ", ".join(f"{path}={actual}" for path, actual in mismatches.items())
              raise SystemExit(f"Release tag {tag} requires version {version}: {details}")

          print(f"Validated release {tag} across {len(versions)} version sources")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_ref={tag}\n")
              output.write(f"version={version}\n")
          PY

  rust-tests:
    name: Rust + Python validation
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-groups --extra dev
      - run: uv run --with maturin maturin develop -m stealthix-core/Cargo.toml
      - run: uv run stealthix --version
      - run: uv run stealthix --cli --help
      - run: uv run cargo test --workspace --quiet
      - run: uv run pytest -q

  build-wheels:
    name: Build wheels — ${{ matrix.target }} (${{ matrix.os }})
    needs: [verify-release, rust-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: -m stealthix-core/Cargo.toml --release --out dist

      - name: Smoke test built wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel artifacts found in dist/")

          expected_prefix = f"stealthix-{os.environ['EXPECTED_VERSION']}-"
          extracted_dirs: list[Path] = []
          for wheel in wheels:
              if not wheel.name.startswith(expected_prefix):
                  raise SystemExit(
                      f"{wheel.name} does not match release version {os.environ['EXPECTED_VERSION']}"
                  )
              extract_dir = Path(tempfile.mkdtemp(prefix=f"{wheel.stem}-"))
              with zipfile.ZipFile(wheel) as archive:
                  archive.extractall(extract_dir)

              entry_points = next(extract_dir.glob("*.dist-info/entry_points.txt"), None)
              if entry_points is None:
                  raise SystemExit(f"{wheel.name} is missing entry_points.txt")

              entry_text = entry_points.read_text(encoding="utf-8")
              if "stealthix=stealthix_headless_cli.main:cli" not in entry_text:
                  raise SystemExit(f"{wheel.name} is missing the stealthix console script entrypoint")

              if not (extract_dir / "stealthix_headless_cli" / "main.py").exists():
                  raise SystemExit(f"{wheel.name} is missing stealthix_headless_cli/main.py")

              extracted_dirs.append(extract_dir)

          subprocess.run(
              [
                  "uv",
                  "pip",
                  "install",
                  "--system",
                  "rich>=13.7.1",
                  "jinja2>=3.1.4",
                  "pyyaml>=6.0.2",
                  "tomli>=2.0.1",
                  "requests>=2.32.3",
                  "reportlab>=4.1.0",
              ],
              check=True,
          )

          env = os.environ.copy()
          env["PYTHONPATH"] = str(extracted_dirs[0]) + os.pathsep + env.get("PYTHONPATH", "")
          subprocess.run([sys.executable, "-m", "stealthix", "--version"], check=True, env=env)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: 1.95.0

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m stealthix-core/Cargo.toml --out dist

      - name: Smoke test built sdist
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import subprocess

          sdist = next(Path("dist").glob("*.tar.gz"))
          expected_name = f"stealthix-{os.environ['EXPECTED_VERSION']}.tar.gz"
          if sdist.name != expected_name:
              raise SystemExit(f"Expected {expected_name}, found {sdist.name}")
          subprocess.run(["uv", "pip", "install", "--system", str(sdist)], check=True)

          exe = shutil.which("stealthix")
          if not exe:
              raise SystemExit("stealthix not found on PATH after sdist install")

          subprocess.run([exe, "--version"], check=True)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload-release:
    name: Upload to GitHub Release
    needs: [verify-release, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -lh dist/
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Upload wheels & sdist to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          tag_name: ${{ needs.verify-release.outputs.release_ref }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
